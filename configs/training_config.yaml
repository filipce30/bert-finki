# Модел
model:
  name: "bert-base-uncased"
  num_labels: 27
  classifier_dropout: 0.1

# Податоци
data:
  dataset_name: "bitext/Bitext-customer-support-llm-chatbot-training-dataset"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  max_seq_length: 64
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  random_seed: 42

# Тренирање
training:
  output_dir: "models"
  learning_rate: 2.0e-5
  batch_size: 16
  eval_batch_size: 32
  num_epochs: 4
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  optimizer: "adamw"
  scheduler: "linear"
  fp16: false
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "f1"

logging:
  log_steps: 100
  save_total_limit: 2

# Репродуцибилност
seed: 42
